name: CI

on:
  push:
    branches: [main]
    # Without a tags filter, pushing a v* tag never starts this workflow, so the publish job never ran.
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/DataAccess_SqlServer.sln

      - name: Build
        run: dotnet build src/DataAccess_SqlServer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/TA.DataAccess.SqlServer.Tests/TA.DataAccess.SqlServer.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'

      # Pack into a fresh folder: ./artifacts holds committed packages of earlier versions.
      - name: Pack
        run: dotnet pack src/TA.DataAccess.SqlServer/TA.DataAccess.SqlServer.csproj --configuration Release --no-build --output ./out

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./out/*.*nupkg

  # Publishes the exact package the build job built and tested.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches project version
        run: |
          $version = (Select-Xml -Path src/TA.DataAccess.SqlServer/TA.DataAccess.SqlServer.csproj -XPath '//Version').Node.InnerText
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version>." }

      - name: Download nupkg
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./out

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./out/*.nupkg --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./out/*.snupkg --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
